<svg viewBox="0 0 880 492" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Las nueve cuencas que caben en una lámina" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif"><rect width="880" height="492" fill="#f5f2e9"/><text x="28.00" y="40.00" font-size="23" fill="#1f262a" text-anchor="start" font-weight="600">Las nueve cuencas que caben en una lámina</text><text x="28.00" y="64.00" font-size="13" fill="#1f262a" text-anchor="start" font-weight="400" font-style="italic">Cuenca aportante en kilómetros cuadrados y caudal medio, según HydroRIVERS. Las dos mayores de la isla</text><text x="28.00" y="81.00" font-size="13" fill="#1f262a" text-anchor="start" font-weight="400" font-style="italic">cruzan la cordillera y desembocan en el Pacífico.</text><text x="116.00" y="143.00" font-size="15" fill="#1f262a" text-anchor="end" font-weight="600">Chepu</text><rect x="128.0" y="128.0" width="542.0" height="20" fill="#426d84"/><text x="680.00" y="143.00" font-size="13" fill="#1f262a" text-anchor="start" font-weight="400">1.027 km² · 48,2 m³/s</text><text x="852.00" y="143.00" font-size="11.5" fill="#6b7a82" text-anchor="end" font-weight="400" font-style="italic">al Pacífico</text><text x="116.00" y="177.00" font-size="15" fill="#1f262a" text-anchor="end" font-weight="600">Cucao</text><rect x="128.0" y="162.0" width="450.8" height="20" fill="#426d84"/><text x="588.83" y="177.00" font-size="13" fill="#1f262a" text-anchor="start" font-weight="400">854 km² · 37,3 m³/s</text><text x="852.00" y="177.00" font-size="11.5" fill="#6b7a82" text-anchor="end" font-weight="400" font-style="italic">al Pacífico</text><text x="116.00" y="211.00" font-size="15" fill="#1f262a" text-anchor="end" font-weight="600">Ancud</text><rect x="128.0" y="196.0" width="207.4" height="20" fill="#b9b09a"/><text x="345.41" y="211.00" font-size="13" fill="#1f262a" text-anchor="start" font-weight="400">393 km² · 19,4 m³/s</text><text x="852.00" y="211.00" font-size="11.5" fill="#6b7a82" text-anchor="end" font-weight="400" font-style="italic">sin declarar en la lámina</text><text x="116.00" y="245.00" font-size="15" fill="#1f262a" text-anchor="end" font-weight="600">Medina</text><rect x="128.0" y="230.0" width="132.1" height="20" fill="#b6cdd8"/><text x="270.13" y="245.00" font-size="13" fill="#1f262a" text-anchor="start" font-weight="400">250 km² · 10,1 m³/s</text><text x="852.00" y="245.00" font-size="11.5" fill="#6b7a82" text-anchor="end" font-weight="400" font-style="italic">al mar interior</text><text x="116.00" y="279.00" font-size="15" fill="#1f262a" text-anchor="end" font-weight="600">Natri</text><rect x="128.0" y="264.0" width="48.3" height="20" fill="#b9b09a"/><text x="186.30" y="279.00" font-size="13" fill="#1f262a" text-anchor="start" font-weight="400">92 km² · 3,9 m³/s</text><text x="852.00" y="279.00" font-size="11.5" fill="#6b7a82" text-anchor="end" font-weight="400" font-style="italic">sin declarar en la lámina</text><text x="116.00" y="313.00" font-size="15" fill="#1f262a" text-anchor="end" font-weight="600">Asasao</text><rect x="128.0" y="298.0" width="47.4" height="20" fill="#b6cdd8"/><text x="185.41" y="313.00" font-size="13" fill="#1f262a" text-anchor="start" font-weight="400">90 km² · 3,4 m³/s</text><text x="852.00" y="313.00" font-size="11.5" fill="#6b7a82" text-anchor="end" font-weight="400" font-style="italic">al mar interior</text><text x="116.00" y="347.00" font-size="15" fill="#1f262a" text-anchor="end" font-weight="600">Colo</text><rect x="128.0" y="332.0" width="37.2" height="20" fill="#b6cdd8"/><text x="175.22" y="347.00" font-size="13" fill="#1f262a" text-anchor="start" font-weight="400">70 km² · 2,8 m³/s</text><text x="852.00" y="347.00" font-size="11.5" fill="#6b7a82" text-anchor="end" font-weight="400" font-style="italic">al mar interior</text><text x="116.00" y="381.00" font-size="15" fill="#1f262a" text-anchor="end" font-weight="600">Huelde</text><rect x="128.0" y="366.0" width="33.9" height="20" fill="#b9b09a"/><text x="171.89" y="381.00" font-size="13" fill="#1f262a" text-anchor="start" font-weight="400">64 km² · 3,0 m³/s</text><text x="852.00" y="381.00" font-size="11.5" fill="#6b7a82" text-anchor="end" font-weight="400" font-style="italic">sin declarar en la lámina</text><text x="116.00" y="415.00" font-size="15" fill="#1f262a" text-anchor="end" font-weight="600">Pío Pío</text><rect x="128.0" y="400.0" width="20.4" height="20" fill="#b9b09a"/><text x="158.38" y="415.00" font-size="13" fill="#1f262a" text-anchor="start" font-weight="400">39 km² · 1,6 m³/s</text><text x="852.00" y="415.00" font-size="11.5" fill="#6b7a82" text-anchor="end" font-weight="400" font-style="italic">sin declarar en la lámina</text><text x="28.00" y="462.00" font-size="11.5" fill="#6b7a82" text-anchor="start" font-weight="400" font-style="italic">La cuenca aportante es la que HydroRIVERS mide en el tramo de más caudal del tronco; el caudal es su media anual</text><text x="28.00" y="477.00" font-size="11.5" fill="#6b7a82" text-anchor="start" font-weight="400" font-style="italic">modelada, no un aforo.</text></svg>