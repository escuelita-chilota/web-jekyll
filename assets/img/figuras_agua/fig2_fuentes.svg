<svg viewBox="0 0 880 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="De dónde bebemos" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, serif"><rect width="880" height="512" fill="#f5f2e9"/><text x="28.00" y="40.00" font-size="23" fill="#1f262a" text-anchor="start" font-weight="600">De dónde bebemos</text><text x="28.00" y="64.00" font-size="13" fill="#1f262a" text-anchor="start" font-weight="400" font-style="italic">Las 296 captaciones de los comités de agua de Chiloé, por la clase de fuente que declara su derecho. La</text><text x="28.00" y="81.00" font-size="13" fill="#1f262a" text-anchor="start" font-weight="400" font-style="italic">columna es cuántas son; debajo, la mediana de ladera sobre cada una y cuánto de esa ladera es bosque.</text><rect x="62.4" y="150.0" width="96.0" height="180.0" fill="#426d84"/><text x="110.40" y="138.00" font-size="21" fill="#1f262a" text-anchor="middle" font-weight="600">147</text><text x="110.40" y="352.00" font-size="14" fill="#1f262a" text-anchor="middle" font-weight="600">Río o estero</text><text x="110.40" y="372.00" font-size="12.5" fill="#b08a5a" text-anchor="middle" font-weight="400">2,5 km²</text><text x="110.40" y="390.00" font-size="12.5" fill="#6d8057" text-anchor="middle" font-weight="400">77% bosque</text><text x="110.40" y="414.00" font-size="11.5" fill="#6b7a82" text-anchor="middle" font-weight="400" font-style="italic">cuenca medible aguas</text><text x="110.40" y="429.00" font-size="11.5" fill="#6b7a82" text-anchor="middle" font-weight="400" font-style="italic">arriba</text><rect x="227.2" y="272.4" width="96.0" height="57.6" fill="#b08a5a"/><text x="275.20" y="260.45" font-size="21" fill="#1f262a" text-anchor="middle" font-weight="600">47</text><text x="275.20" y="352.00" font-size="14" fill="#1f262a" text-anchor="middle" font-weight="600">Vertiente</text><text x="275.20" y="372.00" font-size="12.5" fill="#b08a5a" text-anchor="middle" font-weight="400">0,05 km²</text><text x="275.20" y="390.00" font-size="12.5" fill="#6d8057" text-anchor="middle" font-weight="400">52% bosque</text><text x="275.20" y="414.00" font-size="11.5" fill="#6b7a82" text-anchor="middle" font-weight="400" font-style="italic">solo la altura a la que</text><text x="275.20" y="429.00" font-size="11.5" fill="#6b7a82" text-anchor="middle" font-weight="400" font-style="italic">brota</text><rect x="392.0" y="223.5" width="96.0" height="106.5" fill="#b08a5a"/><text x="440.00" y="211.47" font-size="21" fill="#1f262a" text-anchor="middle" font-weight="600">87</text><text x="440.00" y="352.00" font-size="14" fill="#1f262a" text-anchor="middle" font-weight="600">Pozo</text><text x="440.00" y="372.00" font-size="12.5" fill="#b08a5a" text-anchor="middle" font-weight="400">0,01 km²</text><text x="440.00" y="390.00" font-size="12.5" fill="#6d8057" text-anchor="middle" font-weight="400">25% bosque</text><text x="440.00" y="414.00" font-size="11.5" fill="#6b7a82" text-anchor="middle" font-weight="400" font-style="italic">solo la profundidad</text><text x="440.00" y="429.00" font-size="11.5" fill="#6b7a82" text-anchor="middle" font-weight="400" font-style="italic">declarada</text><rect x="556.8" y="319.0" width="96.0" height="11.0" fill="#426d84"/><text x="604.80" y="306.98" font-size="21" fill="#1f262a" text-anchor="middle" font-weight="600">9</text><text x="604.80" y="352.00" font-size="14" fill="#1f262a" text-anchor="middle" font-weight="600">Lago o laguna</text><text x="604.80" y="372.00" font-size="12.5" fill="#b08a5a" text-anchor="middle" font-weight="400">1,7 km²</text><text x="604.80" y="390.00" font-size="12.5" fill="#6d8057" text-anchor="middle" font-weight="400">70% bosque</text><text x="604.80" y="414.00" font-size="11.5" fill="#6b7a82" text-anchor="middle" font-weight="400" font-style="italic">cuenca medible aguas</text><text x="604.80" y="429.00" font-size="11.5" fill="#6b7a82" text-anchor="middle" font-weight="400" font-style="italic">arriba</text><rect x="721.6" y="322.7" width="96.0" height="7.3" fill="#426d84"/><text x="769.60" y="310.65" font-size="21" fill="#1f262a" text-anchor="middle" font-weight="600">6</text><text x="769.60" y="352.00" font-size="14" fill="#1f262a" text-anchor="middle" font-weight="600">Arroyo</text><text x="769.60" y="372.00" font-size="12.5" fill="#b08a5a" text-anchor="middle" font-weight="400">1,1 km²</text><text x="769.60" y="390.00" font-size="12.5" fill="#6d8057" text-anchor="middle" font-weight="400">84% bosque</text><text x="769.60" y="414.00" font-size="11.5" fill="#6b7a82" text-anchor="middle" font-weight="400" font-style="italic">cuenca medible aguas</text><text x="769.60" y="429.00" font-size="11.5" fill="#6b7a82" text-anchor="middle" font-weight="400" font-style="italic">arriba</text><line x1="28" y1="330" x2="852" y2="330" stroke="#1f262a" stroke-width="1"/><text x="28.00" y="482.00" font-size="11.5" fill="#6b7a82" text-anchor="start" font-weight="400" font-style="italic">En azul, las fuentes cuya ladera se puede recorrer aguas arriba; en café, las que no. La ladera de una vertiente o de</text><text x="28.00" y="497.00" font-size="11.5" fill="#6b7a82" text-anchor="start" font-weight="400" font-style="italic">un pozo es solo el suelo que la rodea: la recarga es subterránea y un modelo de elevación no la ve.</text></svg>